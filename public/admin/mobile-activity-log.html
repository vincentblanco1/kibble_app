<!DOCTYPE html>
<html lang="en">
<head>
<!-- Force Desktop Redirection Script -- see mobile-dashboard.html for notes. -->
<script>
  if (window.innerWidth > 1024 && !/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
    window.location.replace('activity-log.html');
  }
</script>
    <script>
        window.FontAwesomeConfig = {
          autoReplaceSvg: 'nest'
        };
      </script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>KibbleGuard Admin - Activity Log</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="db-sync.js?v=1"></script>
<script src="app.js?v=17-db"></script>
<script src="mobile-nav.js?v=1"></script>
<script>restoreThemeState();restoreTableDensityState();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css?v=11">
<link rel="stylesheet" href="mobile-style.css?v=1">
</head>
<body class="bg-[#FAF6EE] text-stone-800 font-sans antialiased min-h-screen">

<main class="flex flex-col min-h-screen">
  <header class="min-h-20 bg-white border-b border-stone-50 flex flex-wrap items-center justify-between gap-4 px-10 py-4 sticky top-0 z-40">
    <div>
      <h1 class="font-display font-bold text-xl text-dark">Activity Log</h1>
      <p class="text-[11px] text-stone-400 font-bold uppercase tracking-wider">Admin Action Audit Trail</p>
    </div>
  </header>

  <div class="mobile-page-content space-y-5">

    <div class="grid grid-cols-1 gap-4">
      <div class="bg-white p-5 rounded-[1.5rem] border border-stone-100 card-shadow flex items-center gap-4">
        <div class="w-12 h-12 rounded-2xl bg-brand-light text-brand flex items-center justify-center text-xl shrink-0"><i class="fa-solid fa-calendar-day"></i></div>
        <div>
          <p class="text-[10px] font-bold text-stone-500 uppercase tracking-widest">Actions Today</p>
          <h4 class="text-xl font-display font-bold text-dark" id="log-kpi-today">-</h4>
        </div>
      </div>
      <div class="bg-white p-5 rounded-[1.5rem] border border-stone-100 card-shadow flex items-center gap-4">
        <div class="w-12 h-12 rounded-2xl bg-brand-light text-brand flex items-center justify-center text-xl shrink-0"><i class="fa-solid fa-calendar-week"></i></div>
        <div>
          <p class="text-[10px] font-bold text-stone-500 uppercase tracking-widest">Actions This Week</p>
          <h4 class="text-xl font-display font-bold text-dark" id="log-kpi-week">-</h4>
        </div>
      </div>
      <div class="bg-white p-5 rounded-[1.5rem] border border-stone-100 card-shadow flex items-center gap-4">
        <div class="w-12 h-12 rounded-2xl bg-brand-light text-brand flex items-center justify-center text-xl shrink-0"><i class="fa-solid fa-user-check"></i></div>
        <div>
          <p class="text-[10px] font-bold text-stone-500 uppercase tracking-widest">Most Active Admin</p>
          <h4 class="text-sm font-display font-bold text-dark mt-1.5" id="log-kpi-top-admin">-</h4>
        </div>
      </div>
    </div>

    <!-- Filters + Log -->
    <div class="bg-white border border-stone-100 rounded-[2rem] card-shadow overflow-hidden">
      <div class="p-5 border-b border-stone-50 space-y-4">
        <div class="flex items-center justify-between gap-3 flex-wrap">
          <div>
            <h2 class="font-display font-bold text-sm text-dark">Recent Actions</h2>
            <p class="text-[10px] text-stone-400 font-bold uppercase tracking-widest mt-1">Newest first</p>
          </div>
          <p class="text-xs font-bold text-brand bg-brand-light px-4 py-2 rounded-xl"><i class="fa-solid fa-filter mr-1.5"></i><span id="log-visible-count">-</span></p>
        </div>
        <button onclick="openActivityExportOptions()" class="press w-full px-5 py-2.5 text-xs font-bold text-white bg-brand hover:bg-brand-hover rounded-xl shadow-lg shadow-brand/20 transition-all"><i class="fa-solid fa-download mr-1.5"></i>Export Log</button>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label for="log-filter-category" class="block text-[10px] font-bold text-stone-500 uppercase tracking-widest mb-1.5">Category</label>
            <div class="relative">
              <select id="log-filter-category" onchange="setLogCategoryFilter(this.value)" class="appearance-none w-full pl-3.5 pr-9 py-2.5 bg-stone-100 border border-stone-200 rounded-xl text-xs font-bold text-dark focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand/10 transition-all cursor-pointer">
              <option value="all">All categories</option>
              <option value="verify">Verification</option>
              <option value="content">Content</option>
              <option value="users">Users</option>
              <option value="security">Security</option>
              </select>
              <i class="fa-solid fa-chevron-down pointer-events-none absolute right-3.5 top-1/2 -translate-y-1/2 text-[10px] text-stone-400"></i>
            </div>
          </div>
          <div>
            <label for="log-admin-filter" class="block text-[10px] font-bold text-stone-500 uppercase tracking-widest mb-1.5">Admin</label>
            <div class="relative">
              <select id="log-admin-filter" onchange="renderActivityLog()" class="appearance-none w-full pl-3.5 pr-9 py-2.5 bg-stone-100 border border-stone-200 rounded-xl text-xs font-bold text-dark focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand/10 transition-all cursor-pointer">
              <option value="all">All admins</option>
              <option value="Dr. Sarah Chen">Dr. Sarah Chen</option>
              <option value="Jamie Benwick">Jamie Benwick</option>
              <option value="Alex Rivera">Alex Rivera</option>
              </select>
              <i class="fa-solid fa-chevron-down pointer-events-none absolute right-3.5 top-1/2 -translate-y-1/2 text-[10px] text-stone-400"></i>
            </div>
          </div>
          <div>
            <label for="log-date-from" class="block text-[10px] font-bold text-stone-500 uppercase tracking-widest mb-1.5">From date</label>
            <input type="date" id="log-date-from" onchange="renderActivityLog()" aria-label="From date" class="w-full px-3.5 py-2.5 bg-stone-100 border border-stone-200 rounded-xl text-xs font-bold text-dark focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand/10 transition-all">
          </div>
          <div>
            <label for="log-date-to" class="block text-[10px] font-bold text-stone-500 uppercase tracking-widest mb-1.5">To date</label>
            <input type="date" id="log-date-to" onchange="renderActivityLog()" aria-label="To date" class="w-full px-3.5 py-2.5 bg-stone-100 border border-stone-200 rounded-xl text-xs font-bold text-dark focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand/10 transition-all">
          </div>
        </div>
        <button id="log-clear-filters" onclick="clearLogFilters()" class="hidden press w-full text-center px-3 py-2.5 text-xs font-bold text-stone-500 hover:text-dark transition-all"><i class="fa-solid fa-xmark mr-1.5"></i>Clear filters</button>
      </div>
      <div class="divide-y divide-stone-50" id="activity-log-list"></div>
      <div class="hidden p-12 text-center" id="activity-log-empty">
        <div class="w-14 h-14 mx-auto mb-3 relative">
                  <svg class="w-full h-full text-stone-300" viewBox="0 0 24 24" fill="currentColor">
                    <ellipse cx="12" cy="16.2" rx="5" ry="4.1"/>
                    <ellipse cx="5.6" cy="9.2" rx="2.1" ry="2.7" transform="rotate(-18 5.6 9.2)"/>
                    <ellipse cx="10.4" cy="6" rx="2.1" ry="2.7" transform="rotate(-6 10.4 6)"/>
                    <ellipse cx="15.6" cy="6" rx="2.1" ry="2.7" transform="rotate(6 15.6 6)"/>
                    <ellipse cx="19.4" cy="9.2" rx="2.1" ry="2.7" transform="rotate(18 19.4 9.2)"/>
                  </svg>
                </div>
        <p class="text-sm font-bold text-dark">No matching actions</p>
        <p class="text-[11px] text-stone-400 mt-1">Try a different filter or admin.</p>
      </div>
      <div class="p-5 border-t border-stone-50 flex items-center justify-end bg-stone-50/10" id="log-pagination-controls"></div>
    </div>
  </div>
</main>

<script>renderAdminMobileNav('activity-log');</script>
<script src="activity-log.js?v=6-db"></script>

</body>
</html>
