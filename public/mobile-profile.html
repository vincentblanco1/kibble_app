<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>KibbleGuard Mobile — User Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="mobile-style.css">
</head>
<body class="botanical-canvas">

  <!-- Mobile Top Bar -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md px-4 py-3 border-b border-[#ebdcd0] flex items-center justify-between">
    <div class="flex items-center gap-2">
      <a href="mobile-index.html" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-xs text-[#182811]">
        <i class="fa-solid fa-arrow-left"></i>
      </a>
      <h1 class="text-sm font-black text-[#182811]">User Profile</h1>
    </div>
    <a href="mobile-settings.html" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-xs text-[#182811]">
      <i class="fa-solid fa-gear"></i>
    </a>
  </header>

  <main class="p-4 space-y-4">
    <!-- User Avatar & Identity Card -->
    <div class="tactile-card p-5 bg-white text-center space-y-2">
      <div class="relative w-20 h-20 mx-auto">
        <img id="profileAvatarPreview" src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-2.jpg" alt="Avatar" class="w-full h-full rounded-full object-cover border-4 border-[#45671d]">
        <label id="avatarUploadLabel" for="avatarInput" class="hidden absolute bottom-0 right-0 w-6 h-6 bg-[#45671d] text-white rounded-full flex items-center justify-center text-[10px] cursor-pointer shadow-md">
          <i class="fa-solid fa-camera"></i>
        </label>
        <input type="file" id="avatarInput" accept="image/*" class="hidden" disabled>
      </div>
      <div>
        <h2 id="displayFullName" class="text-base font-black text-[#182811]">—</h2>
        <p id="displayEmail" class="text-xs text-[#788673]">—</p>
        <span class="inline-block mt-1 px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800 text-[10px] font-black uppercase">Verified Pet Caregiver</span>
      </div>
      <button type="button" id="editToggleBtn" class="mt-2 px-4 py-1.5 rounded-full bg-[#45671d] text-white text-xs font-bold shadow-xs">
        <i class="fa-solid fa-pen text-[10px] mr-1"></i> Edit Demographic Data
      </button>
    </div>

    <!-- User Form -->
    <form id="userProfileForm" class="tactile-card p-5 bg-white space-y-3.5 text-xs">
      <h3 class="font-extrabold text-xs text-[#182811] uppercase tracking-wider pb-1 border-b border-[#f5efe6]">Personal Information</h3>
      
      <div>
        <label class="font-bold text-[#788673] block mb-1">First Name</label>
        <input type="text" id="firstNameInput" disabled class="w-full bg-[#fbf9f6] border border-[#ebdcd0] rounded-xl px-3 py-2 font-semibold">
      </div>
      <div>
        <label class="font-bold text-[#788673] block mb-1">Middle Name</label>
        <input type="text" id="middleNameInput" disabled class="w-full bg-[#fbf9f6] border border-[#ebdcd0] rounded-xl px-3 py-2 font-semibold">
      </div>
      <div>
        <label class="font-bold text-[#788673] block mb-1">Last Name</label>
        <input type="text" id="lastNameInput" disabled class="w-full bg-[#fbf9f6] border border-[#ebdcd0] rounded-xl px-3 py-2 font-semibold">
      </div>
      <div>
        <label class="font-bold text-[#788673] block mb-1">Email Address</label>
        <input type="email" id="emailInput" disabled class="w-full bg-[#fbf9f6] border border-[#ebdcd0] rounded-xl px-3 py-2 font-semibold">
      </div>
      <div class="grid grid-cols-2 gap-2.5">
        <div>
          <label class="font-bold text-[#788673] block mb-1">Birthdate</label>
          <input type="date" id="birthdateInput" disabled class="w-full bg-[#fbf9f6] border border-[#ebdcd0] rounded-xl px-2.5 py-2 font-semibold">
        </div>
        <div>
          <label class="font-bold text-[#788673] block mb-1">Computed Age</label>
          <input type="text" id="computedAgeDisplay" readonly class="w-full bg-slate-100 border border-[#ebdcd0] rounded-xl px-3 py-2 font-semibold text-[#788673]">
        </div>
      </div>
      <div>
        <label class="font-bold text-[#788673] block mb-1">Gender</label>
        <select id="genderInput" disabled class="w-full bg-[#fbf9f6] border border-[#ebdcd0] rounded-xl px-3 py-2 font-semibold">
          <option value="">— Select —</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Prefer not to say">Prefer not to say</option>
        </select>
      </div>
      <div>
        <label class="font-bold text-[#788673] block mb-1">Country</label>
        <input type="text" id="countryInput" disabled placeholder="e.g. Philippines" class="w-full bg-[#fbf9f6] border border-[#ebdcd0] rounded-xl px-3 py-2 font-semibold">
      </div>
      <div>
        <label class="font-bold text-[#788673] block mb-1">Region / Province</label>
        <input type="text" id="regionInput" disabled placeholder="e.g. NCR" class="w-full bg-[#fbf9f6] border border-[#ebdcd0] rounded-xl px-3 py-2 font-semibold">
      </div>
      <div>
        <label class="font-bold text-[#788673] block mb-1">City / Municipality</label>
        <input type="text" id="cityInput" disabled class="w-full bg-[#fbf9f6] border border-[#ebdcd0] rounded-xl px-3 py-2 font-semibold">
      </div>

      <h3 class="font-extrabold text-xs text-[#182811] uppercase tracking-wider pb-1 border-b border-[#f5efe6] pt-2">Pet Caregiver Details</h3>
      <div>
        <label class="font-bold text-[#788673] block mb-1">Caregiver Role</label>
        <select id="caregiverRoleInput" disabled class="w-full bg-[#fbf9f6] border border-[#ebdcd0] rounded-xl px-3 py-2 font-semibold">
          <option value="Primary Caregiver">Primary Caregiver</option>
          <option value="Co-Caregiver">Co-Caregiver</option>
          <option value="Foster">Foster</option>
          <option value="Veterinary Professional">Veterinary Professional</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div>
        <label class="font-bold text-[#788673] block mb-1">Pet Count</label>
        <input type="number" id="petCountInput" disabled min="0" placeholder="e.g. 2" class="w-full bg-[#fbf9f6] border border-[#ebdcd0] rounded-xl px-3 py-2 font-semibold">
      </div>
      <div>
        <label class="font-bold text-[#788673] block mb-1">Primary Feeding Method</label>
        <select id="feedingStyleInput" disabled class="w-full bg-[#fbf9f6] border border-[#ebdcd0] rounded-xl px-3 py-2 font-semibold">
          <option value="Commercial Dry Kibble">Commercial Dry Kibble</option>
          <option value="Commercial Wet Food">Commercial Wet Food</option>
          <option value="Mixed Feeding">Mixed Feeding (Dry &amp; Wet)</option>
          <option value="Home-Prepared Raw">Home-Prepared Raw</option>
        </select>
      </div>

      <!-- Action Buttons Bar -->
      <div id="profileActionButtonsBar" class="hidden items-center justify-end gap-2 pt-3 border-t border-[#f5efe6]">
        <button type="button" id="cancelProfileEditBtn" class="px-3.5 py-1.5 rounded-xl bg-slate-100 font-bold text-xs text-[#182811]">Cancel</button>
        <button type="submit" class="px-4 py-1.5 rounded-xl bg-[#45671d] font-bold text-xs text-white shadow-xs">Save Changes</button>
      </div>
    </form>
  </main>

  <!-- Mobile Floating Bottom Navigation Bar -->
  <nav class="mobile-bottom-nav">
    <a href="mobile-index.html" class="mobile-nav-item">
      <i class="fa-solid fa-shapes"></i>
      <span>Overview</span>
    </a>
    <a href="mobile-wiki.html" class="mobile-nav-item">
      <i class="fa-solid fa-book-medical"></i>
      <span>Wiki</span>
    </a>
    <a href="mobile-results.html" class="scan-fab-container">
      <div class="scan-fab-bubble">
        <i class="fa-solid fa-camera"></i>
      </div>
      <span class="scan-fab-label">Scan</span>
    </a>
    <a href="mobile-history.html" class="mobile-nav-item">
      <i class="fa-solid fa-clock-rotate-left"></i>
      <span>Logs</span>
    </a>
    <a href="mobile-pets.html" class="mobile-nav-item">
      <i class="fa-solid fa-paw"></i>
      <span>Pets</span>
    </a>
  </nav>

  <script src="app.js"></script>
  <script src="profile.js"></script>
</body>
</html>
