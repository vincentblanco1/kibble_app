<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>KibbleGuard Mobile — Pet Profiles</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="mobile-style.css">
</head>
<body class="botanical-canvas">

  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md px-4 py-3 border-b border-[#ebdcd0] flex items-center justify-between">
    <div class="flex items-center gap-2">
      <img src="kibbleguard-logo.png" onerror="this.onerror=null; this.src='https://api.iconify.design/solar:shield-warning-bold-duotone.svg?color=%2345671d';" alt="Logo" class="w-7 h-7">
      <h1 class="text-sm font-black text-[#182811]">Pet Profiles</h1>
    </div>
    <div class="flex items-center gap-2">
      <span id="mobilePetCount" class="text-[10px] font-extrabold text-[#45671d]">— REGISTERED</span>
      <button id="mobileAddPetBtn" class="w-7 h-7 rounded-full bg-[#45671d] flex items-center justify-center text-xs text-white shadow">
        <i class="fa-solid fa-plus"></i>
      </button>
    </div>
  </header>

  <main id="mobilePetsMain" class="p-4 space-y-3">
    <!-- Pet cards injected by app.js -->
  </main>

  <!-- Add Pet Modal -->
  <!-- z-[60]: the floating bottom nav is z-50 and comes later in the page, so without this the
       nav sits visually on top of this modal -- its camera button was literally intercepting taps
       aimed at "Save Pet" underneath it, even though the button looked reachable. -->
  <div id="mobileAddPetModal" class="fixed inset-0 z-[60] hidden flex items-end justify-center bg-black/40" style="display:none;">
    <div class="bg-white w-full max-w-md rounded-t-3xl p-5 pb-28 overflow-y-auto max-h-[90vh]" style="-webkit-overflow-scrolling:touch; overscroll-behavior:contain;">
      <div class="flex items-center justify-between mb-4">
        <h2 id="mobileModalTitle" class="text-sm font-black text-[#182811]">Add Pet</h2>
        <button id="mobileClosePetModal" class="w-7 h-7 rounded-full bg-slate-100 flex items-center justify-center text-xs text-[#182811]">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <form id="mobileAddPetForm" class="space-y-3">
        <!-- Companion Picture -- desktop's add/edit form has this; mobile's was missing it
             entirely, so a pet's photo could only ever be set by editing on desktop. -->
        <div class="p-3 rounded-2xl bg-[#fbf9f6] border border-[#ebdcd0] flex items-center gap-3">
          <div id="petPhotoPreviewContainer" class="w-14 h-14 rounded-2xl bg-white border-2 border-dashed border-[#ebdcd0] flex items-center justify-center text-xl overflow-hidden shrink-0 shadow-inner">
            <span id="previewEmojiFallback">🐶</span>
            <img id="petPhotoPreviewImg" src="" alt="Preview" class="w-full h-full object-cover hidden">
          </div>
          <div class="flex-1 space-y-1">
            <span class="font-bold text-[#182811] block text-[11px]">Companion Picture</span>
            <div class="flex items-center gap-2">
              <label for="petImageFileInput" class="px-2.5 py-1 bg-white border border-[#ebdcd0] text-[#182811] rounded-lg font-bold text-[10px] cursor-pointer shadow-2xs flex items-center gap-1">
                <i class="fa-solid fa-arrow-up-from-bracket text-[9px]"></i> Choose Photo
              </label>
              <input type="file" id="petImageFileInput" accept="image/*" class="hidden">
              <button type="button" id="removePhotoBtn" class="text-[10px] text-red-600 hover:underline hidden font-semibold">Remove</button>
            </div>
          </div>
        </div>
        <!-- Pet Name -->
        <div>
          <label class="block text-[11px] font-bold text-[#788673] uppercase tracking-wider mb-1">Pet's Name *</label>
          <input type="text" id="mPetNameInput" placeholder="e.g. Luna" required class="w-full px-3.5 py-2.5 rounded-xl bg-[#fbf9f6] border border-[#ebdcd0] text-xs font-semibold focus:outline-none focus:border-[#45671d]">
        </div>
        <!-- Species -->
        <div>
          <label class="block text-[11px] font-bold text-[#788673] uppercase tracking-wider mb-1">Species *</label>
          <select id="mPetSpeciesInput" class="w-full px-3.5 py-2.5 rounded-xl bg-[#fbf9f6] border border-[#ebdcd0] text-xs font-semibold focus:outline-none focus:border-[#45671d]">
            <option value="Canine">Canine (Dog)</option>
            <option value="Feline">Feline (Cat)</option>
          </select>
        </div>
        <!-- Breed -->
        <div>
          <label class="block text-[11px] font-bold text-[#788673] uppercase tracking-wider mb-1">Breed</label>
          <input type="text" id="mPetBreedInput" placeholder="e.g. Labrador Retriever" class="w-full px-3.5 py-2.5 rounded-xl bg-[#fbf9f6] border border-[#ebdcd0] text-xs font-semibold focus:outline-none focus:border-[#45671d]">
        </div>
        <!-- Gender & Weight -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] font-bold text-[#788673] uppercase tracking-wider mb-1">Gender</label>
            <select id="mPetGenderInput" class="w-full px-3 py-2.5 rounded-xl bg-[#fbf9f6] border border-[#ebdcd0] text-xs font-semibold focus:outline-none focus:border-[#45671d]">
              <option value="Neutered Male">Neutered Male</option>
              <option value="Intact Male">Intact Male</option>
              <option value="Spayed Female">Spayed Female</option>
              <option value="Female">Intact Female</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-bold text-[#788673] uppercase tracking-wider mb-1">Weight (kg)</label>
            <input type="number" id="mPetWeightInput" placeholder="e.g. 5.2" step="0.1" min="0" class="w-full px-3 py-2.5 rounded-xl bg-[#fbf9f6] border border-[#ebdcd0] text-xs font-semibold focus:outline-none focus:border-[#45671d]">
          </div>
        </div>
        <!-- Birthdate & Life Stage -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] font-bold text-[#788673] uppercase tracking-wider mb-1">Birthdate</label>
            <input type="date" id="mPetBirthdateInput" class="w-full px-3 py-2.5 rounded-xl bg-[#fbf9f6] border border-[#ebdcd0] text-xs font-semibold focus:outline-none focus:border-[#45671d]">
          </div>
          <div>
            <label class="block text-[11px] font-bold text-[#788673] uppercase tracking-wider mb-1">Life Stage</label>
            <select id="mPetAgeInput" class="w-full px-3 py-2.5 rounded-xl bg-[#fbf9f6] border border-[#ebdcd0] text-xs font-semibold focus:outline-none focus:border-[#45671d]">
              <option value="Puppy/Kitten">Puppy/Kitten</option>
              <option value="Junior">Junior</option>
              <option value="Adult" selected>Adult</option>
              <option value="Mature Adult">Mature Adult</option>
              <option value="Senior">Senior</option>
            </select>
          </div>
        </div>
        <!-- Vaccine & Deworming -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] font-bold text-[#788673] uppercase tracking-wider mb-1">Vaccine Status</label>
            <select id="mPetVaccineInput" class="w-full px-3 py-2.5 rounded-xl bg-[#fbf9f6] border border-[#ebdcd0] text-xs font-semibold focus:outline-none focus:border-[#45671d]">
              <option value="Up to Date">Up to Date</option>
              <option value="Due for Booster">Due for Booster</option>
              <option value="Unvaccinated">Unvaccinated</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-bold text-[#788673] uppercase tracking-wider mb-1">Last Deworming</label>
            <input type="date" id="mPetDewormingInput" class="w-full px-3 py-2.5 rounded-xl bg-[#fbf9f6] border border-[#ebdcd0] text-xs font-semibold focus:outline-none focus:border-[#45671d]">
          </div>
        </div>
        <!-- Sensitivities -->
        <div>
          <label class="block text-[11px] font-bold text-[#788673] uppercase tracking-wider mb-1">Sensitivities / Allergies</label>
          <input type="text" id="mPetSensitivitiesInput" placeholder="e.g. Chicken, BHA/BHT" class="w-full px-3.5 py-2.5 rounded-xl bg-[#fbf9f6] border border-[#ebdcd0] text-xs font-semibold focus:outline-none focus:border-[#45671d]">
        </div>
        <!-- Medicine & Supplements -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] font-bold text-[#788673] uppercase tracking-wider mb-1">Takes Medicine?</label>
            <select id="mPetMedicineInput" class="w-full px-3 py-2.5 rounded-xl bg-[#fbf9f6] border border-[#ebdcd0] text-xs font-semibold focus:outline-none focus:border-[#45671d]">
              <option value="No">No</option>
              <option value="Yes">Yes</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-bold text-[#788673] uppercase tracking-wider mb-1">Takes Supplements?</label>
            <select id="mPetSupplementsInput" class="w-full px-3 py-2.5 rounded-xl bg-[#fbf9f6] border border-[#ebdcd0] text-xs font-semibold focus:outline-none focus:border-[#45671d]">
              <option value="No">No</option>
              <option value="Yes">Yes</option>
            </select>
          </div>
        </div>
        <!-- Medical Conditions -->
        <div>
          <label class="block text-[11px] font-bold text-[#788673] uppercase tracking-wider mb-1">Pre-existing Medical Conditions</label>
          <select id="mPetMedicalConditionsInput" class="w-full px-3.5 py-2.5 rounded-xl bg-[#fbf9f6] border border-[#ebdcd0] text-xs font-semibold focus:outline-none focus:border-[#45671d]">
            <option value="None">None</option>
          </select>
          <p class="text-[10px] text-[#788673] mt-1">Options update based on species.</p>
        </div>
        <!-- Submit -->
        <button type="submit" class="w-full py-3 bg-[#45671d] hover:bg-[#324c14] text-white font-black rounded-xl text-sm transition-all">
          <span id="mPetSaveText">Save Pet</span>
        </button>
      </form>
    </div>
  </div>

  <!-- Floating Center Elevated Dock (Option 03/06) -->
  <nav class="mobile-bottom-nav">
    <a href="mobile-index.html" class="mobile-nav-item">
      <i class="fa-solid fa-shapes"></i>
      <span>Overview</span>
    </a>
    <a href="mobile-wiki.html" class="mobile-nav-item">
      <i class="fa-solid fa-book-medical"></i>
      <span>Wiki</span>
    </a>
    <a href="mobile-results.html" class="scan-fab-container">
      <div class="scan-fab-bubble">
        <i class="fa-solid fa-camera"></i>
      </div>
      <span class="scan-fab-label">Scan</span>
    </a>
    <a href="mobile-history.html" class="mobile-nav-item">
      <i class="fa-solid fa-clock-rotate-left"></i>
      <span>Logs</span>
    </a>
    <a href="mobile-pets.html" class="mobile-nav-item active">
      <i class="fa-solid fa-paw"></i>
      <span>Pets</span>
    </a>
  </nav>

  <script src="app.js"></script>
</body>
</html>
